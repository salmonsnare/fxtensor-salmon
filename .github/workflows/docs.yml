name: Docs

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Deploy runs only for pushes to main. Enabling GitHub Pages itself
# (Settings → Pages → Source: GitHub Actions) is a repository setting;
# this workflow cannot turn that source on.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install documentation dependencies
        run: pip install -e ".[docs]"
      - name: Run documentation examples
        run: python docs/check_examples.py
      - name: Build English HTML
        run: sphinx-build -W --keep-going -b html docs/en docs/_build/html/en -d docs/_build/doctrees/en
      - name: Build Japanese HTML
        run: sphinx-build -W --keep-going -b html docs/ja docs/_build/html/ja -d docs/_build/doctrees/ja
      - name: Add the site root
        run: cp docs/index.html docs/_build/html/index.html
      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
