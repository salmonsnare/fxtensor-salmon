# pyproject.toml


[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fxtensor_salmon"
version = "0.2.2"
authors = [
  { name="Tadachika Oki", email="sakesnare@gmail.com" }, 
]
description = "Markov Tensor Module"
readme = "README.md"
requires-python = ">=3.8"
license = { file="LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/salmonsnare/fxtensor-salmon"

[tool.setuptools.packages.find]
where = ["src"]
include = ["fxtensor_salmon"]

[tool.ruff]
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "E711"]

[tool.ruff.lint.per-file-ignores]
"src/fxtensor_salmon/io.py" = ["F821"]
"src/fxtensor_salmon/operations.py" = ["F821"]
"src/fxtensor_salmon/special.py" = ["F821"]
