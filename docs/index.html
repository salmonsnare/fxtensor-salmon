<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FXTensor — Markov Tensor Module</title>
  <link rel="canonical" href="en/">
  <link rel="alternate" hreflang="en" href="en/">
  <link rel="alternate" hreflang="ja" href="ja/">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f5f3;
      --card: #ffffff;
      --text: #1d1c1a;
      --muted: #5c5852;
      --line: #e4e0d8;
      --accent: #243026;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #171816;
        --card: #22211e;
        --text: #f3f1ec;
        --muted: #b7b2a8;
        --line: #3a3834;
        --accent: #e7efe4;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font: 18px/1.5 "Iowan Old Style", Palatino, "Palatino Linotype", "Hiragino Mincho ProN", serif;
    }
    main {
      width: min(40rem, calc(100% - 2rem));
      background: var(--card);
      border: 1px solid var(--line);
      padding: 2.25rem 2rem 2rem;
    }
    p { margin: 0 0 1rem; }
    .kicker {
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-family: "Source Sans 3", "Segoe UI", sans-serif;
      font-size: 0.78rem;
      color: var(--muted);
    }
    h1 {
      font-size: 2.4rem;
      font-weight: 600;
      margin: 0.2rem 0 0.8rem;
    }
    .ja { color: var(--muted); }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-top: 1.4rem;
    }
    a.button {
      display: inline-block;
      padding: 0.55rem 1rem;
      text-decoration: none;
      font-family: "Source Sans 3", "Segoe UI", sans-serif;
      border: 1px solid var(--accent);
    }
    a.primary { background: var(--accent); color: var(--bg); }
    a.secondary { color: var(--text); }
  </style>
</head>
<body>
  <main>
    <p class="kicker">Markov Tensor Module</p>
    <h1>FXTensor</h1>
    <p>English is the default language for this site. FXTensor is a Python library for finite Markov kernels represented as labeled tensors.</p>
    <p class="ja">日本語版は下のリンクから開けます。FXTensor は、有限マルコフ核をラベル付きテンソルとして扱う Python ライブラリです。</p>
    <div class="actions">
      <a class="button primary" href="en/">English</a>
      <a class="button secondary" href="ja/">日本語</a>
    </div>
  </main>
</body>
</html>
