{% extends "!page.html" %}

{% block extrahead %}
{{ super() }}
{%- if language_switch_url %}
<link rel="alternate" hreflang="{{ language_switch_hreflang }}" href="{{ language_switch_url }}">
{%- endif %}
{% endblock %}

{% block announcement %}
{%- if language_switch_url %}
<a class="language-switch" href="{{ language_switch_url }}">{{ language_switch_label }}</a>
{%- endif %}
{% endblock %}
